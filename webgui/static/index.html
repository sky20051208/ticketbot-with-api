<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>MINECRAFT TICKET BOT</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <div class="block-icon"></div>
      <div class="title-stack">
        <div class="title">MINECRAFT</div>
        <div class="subtitle">T I C K E T &nbsp;B O T &nbsp;·&nbsp; v 1 . 0 &nbsp;·&nbsp; W E B</div>
      </div>
    </div>
    <div class="controls">
      <span class="lbl">INSTANCES</span>
      <input id="instance-count" type="text" value="2" class="fld" style="width:48px;text-align:center;">
      <button id="btn-init" class="btn btn-cyan">INIT</button>
      <button id="btn-start-all" class="btn btn-green">START ALL</button>
      <button id="btn-stop-all" class="btn btn-red">STOP ALL</button>
      <button id="btn-customers" class="btn btn-cyan">客人管理</button>
    </div>
  </header>
  <main id="grid"></main>

  <!-- 客人管理面板（LINE 推播對象；資料在 Cloudflare D1，客服 bot 登記也寫這份，這裡走 /api/customers proxy） -->
  <div id="customer-modal" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-head">
        <span>客人管理（LINE 推播）</span>
        <button id="btn-customers-close" class="btn btn-red">✕</button>
      </div>
      <div class="modal-hint">登記新客人：客人加 LINE 官方帳號好友，輸入「搶票」後依序回覆姓名、演唱會，會自動出現在這裡（24/7 都能登記，不用開電腦）。也可以手動新增。</div>
      <div id="customer-list" class="customer-list"></div>
      <div class="customer-add">
        <input id="cust-name" class="fld" type="text" placeholder="名字">
        <input id="cust-concert" class="fld" type="text" placeholder="演唱會（選填）">
        <input id="cust-uid" class="fld" type="text" placeholder="LINE userId（U 開頭 33 碼）">
        <button id="btn-cust-add" class="btn btn-green">新增</button>
      </div>
    </div>
  </div>

  <template id="card-template">
    <section class="card">
      <div class="card-inner">
        <div class="card-head">
          <div class="diamond"></div>
          <span class="card-name"></span>
          <span class="status"></span>
          <span class="spacer"></span>
          <button class="btn btn-cyan btn-save" title="只存設定不啟動，寫進 profiles/acc_N/config.json">SAVE</button>
          <button class="btn btn-green btn-start">START</button>
          <button class="btn btn-yellow btn-pause">PAUSE</button>
          <button class="btn btn-red btn-stop">STOP</button>
        </div>
        <div class="divider"></div>
        <div class="config-panel">
          <div class="fields">
            <div class="field"><label>PLATFORM</label><select class="fld f-platform"></select></div>
            <div class="field"><label>ACTIVITY SLUG</label><input class="fld f-slug" type="text"></div>
            <div class="field"><label>START TIME</label><input class="fld f-time" type="text"></div>
            <div class="field f-narrow"><label>QTY</label><input class="fld f-qty" type="text"></div>
            <div class="field f-narrow"><label>開賣後延遲(秒)</label><input class="fld f-grabdelay" type="text" title="遠大專用：開賣後等這麼多秒才送單，避開開賣瞬間 CDN 還回舊快取/空排。0=不延遲"></div>

            <div class="field"><label>AREA MODE</label><select class="fld f-areamode"></select></div>
            <div class="field"><label>CLEAR MODE</label><select class="fld f-clearmode" title="嚴格 = 只買 AREA KEYWORD 命中的票區，其餘一律不買&#10;寬鬆 = 命中的優先，但會依「志願順序 × 剩餘張數」挑期待值最高的，買不到首選時退而求其次"></select></div>
            <div class="field"><label>AREA KEYWORD (; or +)</label><input class="fld f-area" type="text" placeholder="綠517 / 綠517;綠516 / G05+6980" title="; 分隔 = OR 優先序（依序試，第一個命中即用）&#10;+ 分隔 = AND 同時含（必須同時包含）&#10;可混用，例：G05+6980;G05 (先精準找 G05 的 6980，沒則 fallback G05 任意)"></div>
            <div class="field"><label>EXCLUDE (;)</label><input class="fld f-exclude" type="text"></div>
            <div class="field f-narrow"><label>DATE</label><input class="fld f-date" type="text"></div>

            <div class="field"><label>PRESALE CODE</label><input class="fld f-presale" type="text"></div>
            <div class="field f-wide"><label>LIVENATION 起始頁 (USERDATA 模式)</label><input class="fld f-livenationstart" type="text" placeholder="https://www.livenation.com.tw/event/xxx/" title="livenation 模式：搭配 USERDATA cookie，Chrome 從這個 URL 開啟（livenation 活動頁）。使用者在 livenation 登入並點「藝人官方預售」按鈕跳到 tixcraft，bot 偵測 URL 進到 tixcraft 域就抓 cookie。session 帶著真實 livenation referer 歷史。空字串=直接開 tixcraft /login。"></div>
            <div class="field f-wide"><label>WATCH URL (BROWSER MODE)</label><input class="fld f-watchurl" type="text"></div>
            <div class="field f-narrow flags">
              <label class="check"><input type="checkbox" class="f-timer"><span>TIMER</span></label>
              <label class="check"><input type="checkbox" class="f-proxy"><span>PROXY POOL</span></label>
              <label class="check" title="勾選 = 剩餘量不足 QTY 張的票種直接跳過，不會退而求其次買少一點"><input type="checkbox" class="f-requirefull"><span>剩餘不足不買</span></label>
            </div>

            <div class="field f-narrow"><label>出口 IP</label><select class="fld f-bindip" title="多 IP 架構：選一顆 OCI VNIC 上的次要私有 IP，這張卡的所有流量（curl_cffi + Chrome）都從對應的公網 IP 出去，取代 proxy 做多開隔離。清單是直接讀機器網卡的，由 rotate_ips.py --sync-os 在開機時跟 OCI 對帳掛上。選「(預設出口)」= 走主 IP，多張卡片會共用同一個對外 IP"></select></div>

            <div class="field"><label>客人 (LINE通知)</label><select class="fld f-lineuser" title="搶到票後推 LINE 通知給這個客人。客人清單用 topbar「客人管理」維護（客人自己跟客服 bot 對話登記會自動加入）。選 (不推播) = 這張卡不通知。"></select></div>
            <div class="field f-narrow"><label>搶票費</label><input class="fld f-fee" type="text" placeholder="800" title="寫進通知訊息的搶票費金額（每個客人不同）"></div>

            <div class="field"><label>帳號 PROFILE</label><select class="fld f-profile" title="選 chrome profile；(手貼COOKIE) 則用右側 COOKIE 欄位"></select></div>
            <div class="field f-span3"><label>COOKIE</label><input class="fld f-cookie cookie" type="text"></div>
          </div>
        </div>
        <div class="log-box">
          <div class="log-head">
            <span class="term-dot"></span>
            <span class="term-title">TERMINAL</span>
            <span class="term-meta"></span>
          </div>
          <pre class="log"></pre>
        </div>
      </div>
    </section>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
